<!DOCTYPE html>
<html lang="es">

<head>

    <style>
        body {

            display: flex;

            width: 100%;
            height: 40px;

            border-radius: 6px;
            padding: 0 10px;
            font-size: 16px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            height: 45px;
            background-color: #2563EB;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:active {
            background-color: #1E40AF;
        }
    </style>
    <link rel="stylesheet" href="./main.css">
</head>

user-select: none;

max-height:70px;

            color:white;

max-height:70px;

            background:#F59E0B;

    <button style="margin-top: 100%; width: 20%; height: 10%;" id="back"><</button>
    <button style="margin-top: 100%; width: 20%; height: 10%;" id="front">></button>

    <script>
class popup {

    constructor(msg, duracion = 3000, tipo = "notification") {

        const container = document.getElementById("popup-container");

        const notification = document.createElement("div");

        notification.className = `popup ${tipo}`;

        let icon = "i";

        if (tipo === "success") {
            icon = "✓";
        }

        if (tipo === "error") {
            icon = "!";
        }

        notification.innerHTML = `
            <div class="popup-icon">${icon}</div>
            <div class="popup-message">${msg}</div>
        `;

        container.appendChild(notification);

        setTimeout(() => {

            notification.style.animation = "popupOut 0.25s ease";

            setTimeout(() => {
                notification.remove();
            }, 250);

        }, duracion);
    }
}
</script>

        <script src="./scriptMobile.js"></script>

</body>

<div id="popup-container"></div>
<link rel="stylesheet"></link>

</html>
